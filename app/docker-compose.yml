services:
  postgres:
    image: postgres:16-alpine
    container_name: foodtailor-db
    environment:
      POSTGRES_USER: foodtailor
      POSTGRES_PASSWORD: foodtailor
      POSTGRES_DB: foodtailor
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foodtailor']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
